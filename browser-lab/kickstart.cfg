#===============================================
# Browser Test Lab — Fedora 43 Kickstart
# 27 browser containers (Chrome, Firefox, Edge)
# Versies 2021–2025
#===============================================

# Basisinstellingen
lang en_US.UTF-8
keyboard --xlayouts='us','nl'
timezone Europe/Amsterdam --utc
rootpw --lock
selinux --enforcing
firewall --enabled --port=7001-7009:tcp,7101-7109:tcp,7201-7209:tcp,4401-4409:tcp,4501-4509:tcp,4601-4609:tcp

# Netwerk
network --bootproto=dhcp --device=link --activate --hostname=browserlab

# Gebruiker aanmaken (wijzig wachtwoord naar wens)
user --name=user --groups=wheel --password=browserlab --plaintext

# Schijfconfiguratie — wist de hele schijf
zerombr
clearpart --all --initlabel
autopart --type=btrfs

# Bootloader
bootloader --append="rhgb quiet"

# Packages
%packages
@core
@workstation-product-environment
git
curl
wget
htop
tmux
vim
net-tools
python3
python3-pip
nodejs
npm
qemu-kvm
libvirt
virt-manager
virt-install
bridge-utils
edk2-ovmf
swtpm
swtpm-tools
open-vm-tools
open-vm-tools-desktop
# Playwright dependencies (WebKit werkt niet, maar Chromium/Firefox wel)
alsa-lib
atk
at-spi2-atk
cups-libs
libdrm
mesa-libgbm
pango
cairo
libxkbcommon
libXcomposite
libXdamage
libXfixes
libXrandr
libwayland-client
libwayland-server
nss
nspr
gtk3
libXt
enchant2
libsecret
hyphen
harfbuzz-icu
libmanette
gstreamer1-plugins-good
gstreamer1-plugins-base
woff2
gstreamer1-libav
gstreamer1-plugins-bad-free
%end

# Post-installatie script (draait als root na installatie)
%post --log=/root/kickstart-post.log

echo "=== Browser Test Lab — Post-install gestart ==="

#-----------------------------------------------
# 1. Automatische updates uitzetten (Fedora 43)
#-----------------------------------------------
# dnf-automatic bestaat niet op Fedora 43
systemctl mask dnf-automatic-install.timer 2>/dev/null || true
systemctl disable packagekit 2>/dev/null || true
systemctl mask packagekit || true

# GNOME Software updates uitzetten
mkdir -p /etc/dconf/db/local.d
cat > /etc/dconf/db/local.d/00-no-updates << 'DCONFEOF'
[org/gnome/software]
download-updates=false
allow-updates=false
DCONFEOF
dconf update || true

#-----------------------------------------------
# 2. Docker installeren (dnf5 syntax)
#-----------------------------------------------
dnf config-manager addrepo --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

systemctl enable docker
usermod -aG docker user

#-----------------------------------------------
# 3. Libvirt/KVM inschakelen
#-----------------------------------------------
systemctl enable libvirtd
usermod -aG libvirt user

#-----------------------------------------------
# 4. Swap file aanmaken
#-----------------------------------------------
fallocate -l 8G /swapfile
chmod 600 /swapfile
mkswap /swapfile
swapon /swapfile
echo '/swapfile none swap sw 0 0' >> /etc/fstab

#-----------------------------------------------
# 5. Docker Compose bestand klaarzetten
#-----------------------------------------------
mkdir -p /home/user/browser-lab
cat > /home/user/browser-lab/docker-compose.yml << 'INNEREOF'
